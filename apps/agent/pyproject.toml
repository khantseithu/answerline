[project]
name = "answerline-agent"
version = "0.0.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "answerline-llm",
  "asyncpg>=0.32.0",
  "livekit-agents[anthropic,cartesia,deepgram,google,openai,silero]~=1.8",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "pyyaml>=6.0.3",
]

[project.scripts]
answerline-agent = "answerline_agent.main:main"

[tool.uv.sources]
answerline-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
