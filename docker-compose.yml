services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: answerline
      POSTGRES_PASSWORD: answerline
      POSTGRES_DB: answerline
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answerline"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --redis-host redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  sip:
    image: livekit/sip:latest
    entrypoint: ["livekit-sip"]
    environment:
      SIP_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: ${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-10100}
        nat_1_to_1_ip: "${SIP_PUBLIC_IP:-}"
        health_port: 8080
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-10100}:${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-10100}/udp"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3",
        ]
      interval: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-answerline}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-answerline-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    command: mb --ignore-existing local/${S3_BUCKET:-recordings}
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-answerline}:${S3_SECRET_KEY:-answerline-secret}@minio:9000
    depends_on:
      - minio
    restart: on-failure

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        storage:
          s3:
            access_key: ${S3_ACCESS_KEY:-answerline}
            secret: ${S3_SECRET_KEY:-answerline-secret}
            region: ${S3_REGION:-us-east-1}
            endpoint: http://minio:9000
            bucket: ${S3_BUCKET:-recordings}
            force_path_style: true
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
