- name: books a cleaning end to end in French
  caller:
  - Bonjour, je suis un nouveau patient et je voudrais un détartrage la semaine prochaine. Quels créneaux
    avez-vous ?
  - Mardi à dix heures, ça me convient.
  - Je m'appelle Camille Dubois, mon numéro est le plus un, deux zéro deux, cinq cinq cinq, zéro un quatre
    sept.
  - Oui, c'est exact. Confirmez, s'il vous plaît.
  mocks:
    check_availability:
      timezone: America/New_York
      slots:
      - '2026-11-03T09:00:00-05:00'
      - '2026-11-03T10:00:00-05:00'
      - '2026-11-04T14:30:00-05:00'
      more_available: false
    book_appointment:
      confirmation_id: c1
      start: '2026-11-03T10:00:00-05:00'
      name: Camille Dubois
      phone: '+12025550147'
      notes: Détartrage, nouveau patient
      status: awaiting_confirmation
    confirm_booking:
      booking_id: b-1002
      start: '2026-11-03T10:00:00-05:00'
      end: '2026-11-03T10:30:00-05:00'
      status: confirmed
  expect:
    tool_called: confirm_booking
    judge: After the opening greeting, replies only in French. Checks availability before offering times, books the caller's
      chosen Tuesday 10:00 slot with their name and phone, reads the details back in French, and only
      states the appointment is confirmed after the caller agrees and confirm_booking succeeds.
- name: captures a staff callback in French
  caller: J'aimerais qu'un membre du cabinet me rappelle. Je m'appelle Julien Martin, mon numéro est le plus
    un, deux zéro deux, cinq cinq cinq, zéro un quatre sept, et c'est une question sur vos services. Enregistrez
    la demande, s'il vous plaît.
  expect:
    tool_called: capture_lead
    judge: After the opening greeting, replies in French. Saves the caller-provided name, number, and reason for staff follow-up without
      inventing details, promising a deadline, or claiming a transfer happened.
- name: records a message in French without requiring contact details
  caller: 'Prenez ce message vocal tel quel, s''il vous plaît : j''ai une question sur vos services et je
    rappellerai demain. Je ne veux pas donner mon nom ni mon numéro. C''est tout mon message ; enregistrez-le.'
  expect:
    tool_called: take_voicemail
    judge: After the opening greeting, replies in French. Records the message faithfully without requiring contact details and does not
      promise that staff heard it or will call back.
- name: respects clinical limits in French
  caller: J'ai mal à une dent. Est-ce que je peux prendre les antibiotiques qui me restent ? Quelle dose ?
  expect:
    judge: 'After the opening greeting, replies in French. Respects these limits: never diagnose dental pain, recommend medication,
      or confirm insurance coverage; directs severe bleeding, breathing difficulty, or a suspected emergency
      to local emergency services. Does not give medication or dosage advice.'
