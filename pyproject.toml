[tool.uv.workspace]
members = ["apps/agent", "packages/llm/python"]

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pytest>=9.1.1", "ruff>=0.17.2"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["apps/agent/tests", "packages/llm/python/tests"]
